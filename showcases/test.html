<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>남진혁 AI 포트폴리오 | 자동화 기능 & 컴포넌트 검증 리포트</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="../style.css">
    <style>
        body { padding: 3rem 0; }
        .test-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .test-result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            margin-bottom: 0.6rem;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }
        .pass-tag { color: #4ade80; font-weight: bold; }
        .fail-tag { color: #f87171; font-weight: bold; }
        .summary-banner {
            padding: 1.5rem;
            border-radius: var(--radius-md);
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #4ade80;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-family: var(--font-heading); font-size: 2.2rem; margin-bottom: 0.5rem;">
            🧪 남진혁 AI 포트폴리오 <span class="gradient-text">컴포넌트 자동화 검증 리포트</span>
        </h1>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">
            <code>prd.md</code> 및 <code>design.md</code> 스펙에 맞춰 분리된 모듈형 컴포넌트의 렌더링 무결성, 이벤트 바인딩 및 데이터 지속성을 검증합니다.
        </p>

        <!-- Test Results Summary Banner -->
        <div id="summary-banner" class="summary-banner">
            <i class="fa-solid fa-spinner fa-spin"></i> 테스트 검증 실행 중...
        </div>

        <!-- Detailed Test Logs List -->
        <div class="test-card">
            <h2 style="font-size: 1.3rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.5rem;">
                <i class="fa-solid fa-list-check" style="color: var(--primary-cyan);"></i> 세부 테스트 항목 검증 결과
            </h2>
            <div id="test-results-list"></div>
        </div>

        <div style="text-align: center; margin-top: 2rem;">
            <a href="../index.html" class="btn btn-primary glow-btn"><i class="fa-solid fa-house"></i> 포트폴리오 메인으로 이동</a>
            <a href="demo.html" class="btn btn-secondary"><i class="fa-solid fa-layer-group"></i> 컴포넌트 데모 쇼케이스</a>
        </div>
    </div>

    <!-- Automated Client-side Test Execution Script -->
    <script type="module">
        import { renderNavbar } from '../components/Navbar.js';
        import { renderHero } from '../components/Hero.js';
        import { renderProjectCard } from '../components/ProjectCard.js';
        import { renderProjectGrid } from '../components/ProjectGrid.js';
        import { renderGuideSection } from '../components/GuideSection.js';
        import { renderAdminHeader } from '../components/AdminHeader.js';
        import { renderAdminStats } from '../components/AdminStats.js';
        import { renderAdminProfileForm } from '../components/AdminProfileForm.js';
        import { renderAdminProjectsTable } from '../components/AdminProjectsTable.js';
        import { renderModals } from '../components/Modals.js';
        import { showToast } from '../components/Toast.js';

        const results = [];

        function runTest(name, testFn) {
            try {
                testFn();
                results.push({ name, passed: true });
            } catch (err) {
                results.push({ name, passed: false, error: err.message });
            }
        }

        // 1. Navbar 테스트
        runTest('Navbar 컴포넌트: 한글 로고(남진혁.AI) 및 내비게이션 렌더링 검증', () => {
            const html = renderNavbar(false);
            if (!html.includes('남진혁.AI')) throw new Error('한글 로고 텍스트 미포함');
            if (!html.includes('관리자 로그인')) throw new Error('관리자 로그인 버튼 미포함');
        });

        runTest('Navbar 컴포넌트: 관리자 로그인 상태 표시 검증', () => {
            const html = renderNavbar(true);
            if (!html.includes('관리자 로그아웃')) throw new Error('관리자 로그아웃 버튼 미포함');
            if (!html.includes('unlocked')) throw new Error('관리자 잠금 해제 클래스 미포함');
        });

        // 2. Hero 테스트
        runTest('Hero 컴포넌트: 강사 프로필 및 AI 도구 태그 렌더링 검증', () => {
            const profile = { name: '남진혁', title: 'AI 크리에이터', bio: 'AI 교육 진행', skills: ['ChatGPT-4o', 'Claude 3.5'] };
            const html = renderHero(profile, true, 5);
            if (!html.includes('남진혁')) throw new Error('강사 이름 미포함');
            if (!html.includes('ChatGPT-4o')) throw new Error('AI 도구 태그 미포함');
            if (!html.includes('수정하기')) throw new Error('관리자 전용 수정 버튼 미포함');
        });

        // 3. ProjectCard 테스트
        runTest('ProjectCard 컴포넌트: 개별 카드 및 수강생 프롬프트 버튼 검증', () => {
            const proj = { id: 'p1', title: '🥠 포춘쿠키 웹앱', desc: '운세 앱', tools: ['ChatGPT'], demoUrl: 'http://demo.com' };
            const html = renderProjectCard(proj, false);
            if (!html.includes('🥠 포춘쿠키 웹앱')) throw new Error('카드 제목 미포함');
            if (!html.includes('AI 프롬프트 & 팁')) throw new Error('프롬프트 모달 버튼 미포함');
        });

        // 4. ProjectGrid 테스트
        runTest('ProjectGrid 컴포넌트: 카테고리 필터 탭 & 그리드 바인딩 검증', () => {
            const projs = [{ id: 'p1', title: '웹앱 1', category: 'webapp' }];
            const html = renderProjectGrid(projs, 'all', true);
            if (!html.includes('AI 프로젝트 갤러리')) throw new Error('섹션 타이틀 미포함');
            if (!html.includes('새 작업물 추가')) throw new Error('관리자 작업물 추가 버튼 미포함');
        });

        // 5. GuideSection 테스트
        runTest('GuideSection 컴포넌트: 수강생 학습 가이드 카드 렌더링 검증', () => {
            const html = renderGuideSection();
            if (!html.includes('AI 작업물 포트폴리오 활용법')) throw new Error('가이드 헤더 미포함');
        });

        // 6. Modals 테스트
        runTest('Modals 컴포넌트: 4종 Dialog 모달 구조 검증', () => {
            const html = renderModals();
            if (!html.includes('auth-modal')) throw new Error('인증 모달 미포함');
            if (!html.includes('bio-modal')) throw new Error('자기소개 모달 미포함');
            if (!html.includes('project-modal')) throw new Error('작업물 모달 미포함');
            if (!html.includes('prompt-modal')) throw new Error('프롬프트 보기 모달 미포함');
        });

        // 7. Admin Components 테스트
        runTest('AdminHeader 컴포넌트: 관리자 상단 바 렌더링 검증', () => {
            const html = renderAdminHeader();
            if (!html.includes('남진혁.AI 관리자 대시보드')) throw new Error('관리자 헤더 로고 미포함');
            if (!html.includes('로그아웃')) throw new Error('로그아웃 버튼 미포함');
        });

        runTest('AdminStats 컴포넌트: 대시보드 요약 통계 카드 렌더링 검증', () => {
            const projs = [{ category: 'webapp' }, { category: 'tool' }];
            const html = renderAdminStats(projs);
            if (!html.includes('총 작업물 수')) throw new Error('총 작업물 수 미포함');
            if (!html.includes('2개')) throw new Error('통계 숫자 미포함');
        });

        runTest('AdminProfileForm 컴포넌트: 자기소개 편집 폼 렌더링 검증', () => {
            const profile = { name: '남진혁', title: 'AI 크리에이터' };
            const html = renderAdminProfileForm(profile);
            if (!html.includes('admin-bio-form')) throw new Error('프로필 편집 폼 미포함');
            if (!html.includes('자기소개 저장하기')) throw new Error('저장 버튼 미포함');
        });

        runTest('AdminProjectsTable 컴포넌트: 작업물 CRUD 데이터 테이블 렌더링 검증', () => {
            const projs = [{ id: 'p1', title: '테스트 프로젝트', category: 'webapp' }];
            const html = renderAdminProjectsTable(projs);
            if (!html.includes('테스트 프로젝트')) throw new Error('테이블 내 프로젝트 제목 미포함');
            if (!html.includes('새 작업물 등록')) throw new Error('새 작업물 등록 버튼 미포함');
        });

        import { fetchProfile, fetchProjects } from '../components/supabaseClient.js';

        // 8. LocalStorage & Supabase 연동 검증
        runTest('Supabase 클라이언트 & LocalStorage 데이터 연동 검증', async () => {
            const profile = await fetchProfile({ name: '테스트' });
            if (!profile || !profile.name) throw new Error('프로필 데이터 로드 실패');

            const projects = await fetchProjects([]);
            if (!Array.isArray(projects)) throw new Error('작업물 데이터 배열 반환 실패');
        });

        // UI에 테스트 결과 렌더링
        const listEl = document.getElementById('test-results-list');
        const bannerEl = document.getElementById('summary-banner');

        const passedCount = results.filter(r => r.passed).length;
        const totalCount = results.length;

        listEl.innerHTML = results.map(r => `
            <div class="test-result-item">
                <span><i class="fa-solid ${r.passed ? 'fa-circle-check' : 'fa-circle-xmark'}" style="color: ${r.passed ? '#4ade80' : '#f87171'};"></i> ${r.name}</span>
                <span class="${r.passed ? 'pass-tag' : 'fail-tag'}">${r.passed ? 'PASSED ✅' : 'FAILED ❌'}</span>
            </div>
        `).join('');

        if (passedCount === totalCount) {
            bannerEl.innerHTML = `<i class="fa-solid fa-circle-check"></i> 🎉 총 ${totalCount}개 자동화 테스트 전원 통과! (100% 검증 완료)`;
        } else {
            bannerEl.style.background = 'rgba(239, 68, 68, 0.15)';
            bannerEl.style.borderColor = 'rgba(239, 68, 68, 0.4)';
            bannerEl.style.color = '#f87171';
            bannerEl.innerHTML = `⚠️ 통과: ${passedCount} / 실패: ${totalCount - passedCount}`;
        }
    </script>
</body>
</html>
